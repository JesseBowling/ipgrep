name: Renovate

# Self-hosted Renovate. Setup and secrets: docs/RENOVATE.md
on:
  schedule:
    # Saturday 03:00 UTC. Keep in sync with the schedules in .github/renovate.json5.
    - cron: '0 3 * * 6'
  workflow_dispatch:
    inputs:
      log-level:
        description: Renovate log level
        type: choice
        options: [info, debug]
        default: info
      dry-run:
        description: Dry run mode (none = make real branches and PRs)
        type: choice
        options: [none, extract, lookup, full]
        default: none

# Renovate authenticates with its own token, not GITHUB_TOKEN.
permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Primary: GitHub App token. Skipped when the App is not configured,
      # then the RENOVATE_TOKEN secret (fine-grained PAT) is used instead.
      - name: Create GitHub App token
        id: app-token
        if: vars.RENOVATE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.6
        with:
          token: ${{ steps.app-token.outputs.token || secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # The config is committed (.github/renovate.json5), so no onboarding PR.
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
          # Empty on scheduled runs, which means a normal (real) run.
          RENOVATE_DRY_RUN: ${{ inputs.dry-run != 'none' && inputs.dry-run || '' }}
