name: Lint

# Same triggers as tests-and-coverage.yaml.
on:
  push:
  pull_request:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff (format + lint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Only the dev group: ruff at the version pinned in uv.lock, without the project.
      - name: Install ruff
        run: uv sync --locked --only-dev

      - name: Check formatting
        run: uv run --no-sync ruff format --check --diff src tests

      - name: Lint
        run: uv run --no-sync ruff check --output-format=github src tests
