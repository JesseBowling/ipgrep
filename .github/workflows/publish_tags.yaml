name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Tag to release (vX.Y.Z). An existing tag is rebuilt and its assets
          re-attached. A new tag is created on the selected branch's commit;
          its version must match pyproject.toml there.
        required: true
        type: string

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Validate tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' does not match vX.Y.Z"
            exit 1
          fi

      # A manual run may name a tag that does not exist yet. Build that one from
      # the dispatched commit; the release step creates the tag there.
      - name: Resolve ref to build
        id: ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"
            echo "new_tag=false" >> "$GITHUB_OUTPUT"
            echo "Building existing tag $TAG"
          else
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "new_tag=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG not found; building $GITHUB_REF_NAME at $GITHUB_SHA"
          fi

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Extract version from tag
        id: tag_version
        run: |
          VERSION=${TAG#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag version: $VERSION"

      - name: Extract version from pyproject.toml
        id: project_version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Project version: $VERSION"

      - name: Verify version match
        run: |
          if [ "${{ steps.tag_version.outputs.version }}" != "${{ steps.project_version.outputs.version }}" ]; then
            echo "::error::Tag version (${{ steps.tag_version.outputs.version }}) does not match pyproject.toml version (${{ steps.project_version.outputs.version }}). Bump the version in pyproject.toml first."
            exit 1
          fi
          echo "Version match confirmed: ${{ steps.tag_version.outputs.version }}"

      - name: Build package
        run: uv build

      - name: Create release archive
        run: |
          cd dist
          zip -r ../release-${{ steps.tag_version.outputs.version }}.zip ./*
          cd ..

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.tag_version.outputs.version }}
          NEW_TAG: ${{ steps.ref.outputs.new_tag }}
          TARGET: ${{ steps.ref.outputs.ref }}
        run: |
          ASSETS=(dist/*.whl dist/*.tar.gz "release-${VERSION}.zip")
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Release already exists (e.g. created by hand in the GitHub UI, which
            # also creates the tag that triggered this run). Attach assets only;
            # leave its title and notes untouched.
            echo "Release $TAG exists; uploading assets"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          elif [ "$NEW_TAG" = "true" ]; then
            # Tags pushed with GITHUB_TOKEN do not trigger workflows, so this
            # does not start a second (tag-push) run.
            echo "Creating tag $TAG at $TARGET and its release"
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$TARGET" \
              --title "Release ${VERSION}" \
              --generate-notes
          else
            echo "Release $TAG not found; creating it"
            gh release create "$TAG" "${ASSETS[@]}" \
              --verify-tag \
              --title "Release ${VERSION}" \
              --generate-notes
          fi
