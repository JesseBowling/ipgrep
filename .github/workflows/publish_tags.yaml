name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach assets for (e.g. v0.1.3)'
        required: true
        type: string

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Extract version from tag
        id: tag_version
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: tag '$TAG' does not match vX.Y.Z"
            exit 1
          fi
          VERSION=${TAG#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag version: $VERSION"

      - name: Extract version from pyproject.toml
        id: project_version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Project version: $VERSION"

      - name: Verify version match
        run: |
          if [ "${{ steps.tag_version.outputs.version }}" != "${{ steps.project_version.outputs.version }}" ]; then
            echo "Error: Tag version (${{ steps.tag_version.outputs.version }}) does not match pyproject.toml version (${{ steps.project_version.outputs.version }})"
            exit 1
          fi
          echo "Version match confirmed: ${{ steps.tag_version.outputs.version }}"

      - name: Build package
        run: uv build

      - name: Create release archive
        run: |
          cd dist
          zip -r ../release-${{ steps.tag_version.outputs.version }}.zip ./*
          cd ..

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.tag_version.outputs.version }}
        run: |
          ASSETS=(dist/*.whl dist/*.tar.gz "release-${VERSION}.zip")
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Release already exists (e.g. created by hand in the GitHub UI, which
            # also creates the tag that triggered this run). Attach assets only;
            # leave its title and notes untouched.
            echo "Release $TAG exists; uploading assets"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            echo "Release $TAG not found; creating it"
            gh release create "$TAG" "${ASSETS[@]}" \
              --verify-tag \
              --title "Release ${VERSION}" \
              --generate-notes
          fi
